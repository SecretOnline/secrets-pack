name: Setup packwiz
description: Setup packwiz

runs:
  using: composite
  steps:
    - name: Setup Packwiz
      shell: bash
      run: |
        # wget -q -O packwiz.zip https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip
        # TEMP while packwiz's latest build has expired
        cp .github/lib/packwiz.zip packwiz.zip

        unzip packwiz.zip -d .
        rm packwiz.zip

        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        chmod +x packwiz
        mv packwiz "$HOME/.local/bin"
