name: Update Carpet mod
description: Update the Carpet mod jar to the latest GitHub release matching the pack's Minecraft version

inputs:
  working-directory:
    description: Directory to run packwiz in
    required: false
    default: "."
  minecraft-version:
    description: Minecraft version to find a matching Carpet release for
    required: true

outputs:
  is-update:
    description: Whether the Carpet mod was updated
  changelog-body:
    description: Text to include in the changelog
  pr-body:
    description: Text to include in the pull request body

runs:
  using: "node20"
  main: "index.js"
