name: Modpack New Minecraft Version

on:
  workflow_dispatch:
    inputs:
      minecraft-version:
        description: New Minecraft version
        required: true
        type: string

permissions: {}

jobs:
  update-minecraft:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Setup Packwiz
        uses: SecretOnline/minecraft-actions/setup-packwiz@864a0633b94cd154060d164282f5afc2d77802a9 # v2.1.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Copy new version
        id: copy-new-version
        env:
          MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        run: |
          old_pack_version=$(cat project.json | jq --raw-output '.["version-map"] | keys | map(tonumber) | sort | last')
          old_game_version=$(cat project.json | jq --raw-output '.["version-map"]["'$old_pack_version'"]["game-versions"]')
          old_game_directory=$(cat project.json | jq --raw-output '.["version-map"]["'$old_pack_version'"]["directory"]')
          old_should_run_workflows=$(cat project.json | jq --raw-output '.["version-map"]["'$old_pack_version'"]["should-run-workflows"]')

          cp -r "$old_game_directory" "${MINECRAFT_VERSION}"

          new_pack_version=$((old_pack_version + 1))
          cat project.json | jq '.["version-map"] += { "'$new_pack_version'": { "directory": "${MINECRAFT_VERSION}", "game-versions": "${MINECRAFT_VERSION}", "should-run-workflows": '$old_should_run_workflows' } }' > new-project.json
          rm project.json
          mv new-project.json project.json

          echo "old-game-version=$old_game_version" >> "$GITHUB_OUTPUT"
          echo "new-pack-version=$new_pack_version" >> "$GITHUB_OUTPUT"

      - name: Update pack
        id: update-pack
        uses: "./.github/actions/update-minecraft-version"
        with:
          working-directory: ${{ inputs.minecraft-version }}
          minecraft-version: ${{ inputs.minecraft-version }}

      - name: Packwiz refresh
        working-directory: ${{ inputs.minecraft-version }}
        run: |
          packwiz refresh

      - name: Add to changelog
        id: add-to-changelog
        if: steps.update-pack.outputs.is-update == 'true'
        uses: "./.github/actions/update-project-changelog"
        with:
          working-directory: .
          directory: ${{ inputs.minecraft-version }}
          changelog-body: ${{ steps.update-pack.outputs.changelog-body }}

      - name: Update README version table
        if: steps.update-pack.outputs.is-update == 'true'
        env:
          NEW_PACK_VERSION: ${{ steps.copy-new-version.outputs.new-pack-version }}
          MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        run: |
          new_pack_version=${NEW_PACK_VERSION}
          mc_version="${MINECRAFT_VERSION}"

          # Append new version row to the table (with blank status for now)
          awk -v row="| [${new_pack_version}](https://modrinth.com/modpack/secrets-pack/versions?g=${mc_version}) | Minecraft ${mc_version} |                            |" '
            /^\| \[/ { last = NR }
            { lines[NR] = $0 }
            END {
              for (i = 1; i <= NR; i++) {
                print lines[i]
                if (i == last) print row
              }
            }
          ' README.md > README.md.tmp && mv README.md.tmp README.md

          # Sync maintenance status column from project.json
          sed -i 's/| Active (receiving updates) |/|                            |/g' README.md

          while IFS= read -r ver; do
            sed -i "/^| \[${ver}\]/s/|[[:space:]]*|$/| Active (receiving updates) |/" README.md
          done < <(jq -r '.["version-map"] | to_entries[] | select(.value["should-run-workflows"] == true) | .key' project.json)

      - name: Prepare PR body
        if: steps.update-pack.outputs.is-update == 'true'
        env:
          VERSION_NUMBER: ${{ steps.add-to-changelog.outputs.version-number }}
          PR_BODY: ${{ steps.update-pack.outputs.pr-body }}
        run: |
          touch pr-body.md
          cat << "EOF_AiVMO7YIg1" >> pr-body.md
          This PR contains automated updates from the modpack-new-minecraft-version workflow.

          ## Updates

          Updated version number to v`${VERSION_NUMBER}`. Copy this number for the [deploy workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml).

          ${PR_BODY}

          EOF_AiVMO7YIg1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.update-pack.outputs.is-update == 'true'
        with:
          token: ${{ secrets.CREATE_PR_PAT }}
          add-paths: |
            ${{ inputs.minecraft-version }}
            CHANGELOG.md
            project.json
            README.md
          commit-message: "Update to Minecraft ${{ inputs.minecraft-version }}"
          branch: auto-update/${{ inputs.minecraft-version }}
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update to Minecraft ${{ inputs.minecraft-version }}"
          body-path: pr-body.md
