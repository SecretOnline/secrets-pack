name: Deploy
run-name: Deploy v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      is-release:
        description: Publish release
        required: true
        type: boolean
      version:
        description: Pack version (no v prefix)
        required: true
        type: string

permissions: {}

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Setup Packwiz
        uses: SecretOnline/minecraft-actions/setup-packwiz@864a0633b94cd154060d164282f5afc2d77802a9 # v2.1.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install
        run: |
          npm ci

      - name: Get deploy info
        id: deploy-info
        uses: ./.github/actions/get-deploy-info
        with:
          version: ${{ inputs.version }}

      - name: Ensure Packwiz index is updated
        working-directory: ${{ steps.deploy-info.outputs.directory }}
        shell: bash
        run: |
          packwiz refresh
          git diff --exit-code index.toml

      - name: Override modpack version with release version
        working-directory: ${{ steps.deploy-info.outputs.directory }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -e '/version =/ s/= .*/= "v'"${VERSION}"'"/' pack.toml

      - name: Build modpack
        shell: bash
        env:
          DIRECTORY: ${{ steps.deploy-info.outputs.directory }}
          VERSION: ${{ inputs.version }}
        run: |
          packwiz --pack-file ${DIRECTORY}/pack.toml mr export -o "secrets-pack.${VERSION}.mrpack"

      - name: Parse changelog
        id: changelog
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: query
          version: v${{ inputs.version }}
          changelog: CHANGELOG.md

      - name: Print release details
        env:
          RELEASE_NAME: ${{ steps.deploy-info.outputs.release-name }}
          VERSION: ${{ inputs.version }}
          GAME_VERSIONS: ${{ steps.deploy-info.outputs.game-versions }}
          STEPS_CHANGELOG_OUTPUTS_RELEASE_NOTES: ${{ steps.changelog.outputs.release-notes }}
          LOADERS: ${{ steps.deploy-info.outputs.loaders }}
          MODRINTH_ID: ${{ steps.deploy-info.outputs.modrinth-id }}
        run: |
          echo "name: ${RELEASE_NAME}"
          echo "version: v${VERSION}"
          echo "game-versions: ${GAME_VERSIONS}"
          echo "changelog: ${STEPS_CHANGELOG_OUTPUTS_RELEASE_NOTES}"
          echo "loaders: ${LOADERS}"
          echo "modrinth-id: ${MODRINTH_ID}"

      - name: Create Modrinth Release
        if: inputs.is-release && steps.deploy-info.outputs.modrinth-id != ''
        id: modrinth-release
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          name: ${{ steps.deploy-info.outputs.release-name }}
          version: v${{ inputs.version }}
          game-versions: ${{ steps.deploy-info.outputs.game-versions }}
          changelog: ${{ steps.changelog.outputs.release-notes }}
          loaders: ${{ steps.deploy-info.outputs.loaders }}
          files: secrets-pack.${{ inputs.version }}.mrpack
          modrinth-id: ${{ steps.deploy-info.outputs.modrinth-id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

      - name: Update Modrinth description
        if: inputs.is-release && steps.deploy-info.outputs.modrinth-id != ''
        uses: funnyboy-roks/modrinth-auto-desc@704fa126e2a116083b6a928395dd070263ac07c6 # v1.7
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ steps.deploy-info.outputs.modrinth-id }}
          readme: README.md

      - name: Create GitHub release
        if: inputs.is-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ steps.deploy-info.outputs.release-name }}
          body: ${{ steps.changelog.outputs.release-notes }}
          files: secrets-pack.${{ inputs.version }}.mrpack
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release to Discord
        if: inputs.is-release
        uses: tsickert/discord-webhook@b217a69502f52803de774ded2b1ab7c282e99645 # v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: ${{ steps.deploy-info.outputs.pack-name }} Releases
          avatar-url: ${{ steps.deploy-info.outputs.pack-icon-url }}
          content: |
            ${{ steps.deploy-info.outputs.release-name }} has been released!
            https://modrinth.com/modpack/secrets-pack/version/v${{ inputs.version }}
