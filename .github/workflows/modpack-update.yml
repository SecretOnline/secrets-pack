name: Modpack Auto-update

on:
  workflow_dispatch:
  schedule:
    # 1:13 am Monday UTC
    # = 1:13 pm Monday NZST
    - cron: "13 1 * * 1"

jobs:
  get-build-matrix:
    name: Get build matrix
    runs-on: ubuntu-latest
    outputs:
      has-updates: ${{ steps.build-matrix.outputs.has-updates }}
      update-modpack-mods-matrix: ${{ steps.build-matrix.outputs.update-modpack-mods-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Get build matrix
        id: build-matrix
        uses: ./.github/actions/get-build-matrix

  update-pack:
    runs-on: ubuntu-latest
    needs:
      - get-build-matrix
    if: needs.get-build-matrix.outputs.has-updates == 'true'
    strategy:
      matrix:
        pack-directory: ${{ fromJson(needs.get-build-matrix.outputs.update-modpack-mods-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Packwiz
        uses: SecretOnline/minecraft-actions/setup-packwiz@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Get minecraft version
        uses: SebRollen/toml-action@v1.2.0
        id: get-minecraft-version
        with:
          file: ${{ matrix.pack-directory.directory }}/pack.toml
          field: versions.minecraft

      - name: Update pack
        id: update-pack
        uses: SecretOnline/minecraft-actions/packwiz-update-pack@v2
        with:
          working-directory: ${{ matrix.pack-directory.directory }}

      - name: Render pack update summary
        id: render-pack-update
        if: steps.update-pack.outputs.has-update == 'true'
        env:
          UPDATED_MODS: ${{ steps.update-pack.outputs.updated-mods }}
          LOADER_UPDATE: ${{ steps.update-pack.outputs.loader-update }}
        run: |
          node <<'EOF_RENDER_PACK_UPDATE'
          const fs = require("fs");

          const updatedMods = JSON.parse(process.env.UPDATED_MODS || "[]")
            .map((mod) => mod.name)
            .sort((a, z) => a.localeCompare(z, undefined, { sensitivity: "base" }));

          const loaderUpdateRaw = process.env.LOADER_UPDATE || "";
          const updatedLoader = loaderUpdateRaw ? JSON.parse(loaderUpdateRaw) : undefined;

          const changelogContent = ["### Updated", ""];
          const prContent = [];

          if (updatedLoader) {
            changelogContent.push(`- Updated ${updatedLoader.name} to ${updatedLoader.version}`);
            prContent.push("### Loader", "", `Updated ${updatedLoader.name} to ${updatedLoader.version}`, "");
          }
          if (updatedMods.length > 0) {
            changelogContent.push(`- Updated ${updatedMods.length} mods`);
            prContent.push("### Mods", "", `Updated ${updatedMods.length} mods`, "");

            for (const mod of updatedMods) {
              const modMarkdown = mod.replaceAll("[", "\\[");

              changelogContent.push(`  - ${modMarkdown}`);
              prContent.push(`- ${modMarkdown}`);
            }

            prContent.push("");
          }

          changelogContent.push("");

          const delimiter = "EOF_RENDER_PACK_UPDATE_OUTPUT";
          const output = [
            `changelog-body<<${delimiter}`,
            changelogContent.join("\n"),
            delimiter,
            `pr-body<<${delimiter}`,
            prContent.join("\n"),
            delimiter,
            "",
          ].join("\n");

          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          EOF_RENDER_PACK_UPDATE

      - name: Update Carpet mod
        id: update-carpet
        uses: "./.github/actions/update-carpet-mod"
        with:
          working-directory: ${{ matrix.pack-directory.directory }}
          minecraft-version: ${{ steps.get-minecraft-version.outputs.value }}

      - name: Packwiz refresh after Carpet update
        if: steps.update-carpet.outputs.is-update == 'true'
        working-directory: ${{ matrix.pack-directory.directory }}
        run: |
          packwiz refresh

      - name: Check Fabric mod conflicts
        id: check-conflicts
        if: steps.update-pack.outputs.has-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        uses: SecretOnline/minecraft-actions/check-fabric-conflicts@v2
        with:
          working-directory: ${{ matrix.pack-directory.directory }}
          minecraft-version: ${{ steps.get-minecraft-version.outputs.value }}
          loader: fabric

      - name: Install conflict-resolving versions
        id: install-conflict-fixes
        if: steps.check-conflicts.outputs.has-conflicts == 'true'
        uses: SecretOnline/minecraft-actions/packwiz-install-versions@v2
        with:
          working-directory: ${{ matrix.pack-directory.directory }}
          versions: ${{ steps.check-conflicts.outputs.conflicts }}

      - name: Note conflict fixes
        id: conflict-note
        if: steps.check-conflicts.outputs.has-conflicts == 'true'
        run: |
          COUNT=$(echo '${{ steps.check-conflicts.outputs.conflicts }}' | jq 'length')
          echo "note=> Note: $COUNT mod dependency conflict(s) were automatically resolved by downgrading." >> "$GITHUB_OUTPUT"

      - name: Update Complementary Reimagined config
        if: steps.update-pack.outputs.has-update == 'true'
        run: |
          PACK_DIR="${{ matrix.pack-directory.directory }}"
          SHADER_TOML="$PACK_DIR/shaderpacks/complementary-reimagined.pw.toml"

          if [ ! -f "$SHADER_TOML" ]; then
            exit 0
          fi

          NEW_FILENAME=$(grep '^filename = ' "$SHADER_TOML" | sed 's/filename = "\(.*\)"/\1/')
          SHADERPACKS_CONFIG_DIR="$PACK_DIR/config/yosbr/shaderpacks"
          IRIS_PROPERTIES="$PACK_DIR/config/yosbr/config/iris.properties"
          NEW_TXT="$SHADERPACKS_CONFIG_DIR/${NEW_FILENAME}.txt"

          OLD_TXT=$(find "$SHADERPACKS_CONFIG_DIR" -maxdepth 1 -name '*.txt' | head -1)

          if [ -n "$OLD_TXT" ] && [ "$OLD_TXT" != "$NEW_TXT" ]; then
            mv "$OLD_TXT" "$NEW_TXT"
            sed -i "s/shaderPack=.*/shaderPack=$NEW_FILENAME/" "$IRIS_PROPERTIES"
            cd "$PACK_DIR" && packwiz refresh
          fi

      - name: Add to changelog
        id: add-to-changelog
        if: steps.update-pack.outputs.has-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        uses: "./.github/actions/update-project-changelog"
        with:
          working-directory: .
          directory: ${{ matrix.pack-directory.directory }}
          changelog-body: |
            ${{ steps.render-pack-update.outputs.changelog-body }}
            ${{ steps.update-carpet.outputs.changelog-body }}

      - name: Prepare PR body
        if: steps.update-pack.outputs.has-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        run: |
          touch pr-body.md
          cat << "EOF_AiVMO7YIg1" >> pr-body.md
          This PR contains automated updates from auto-update workflow.

          ## Updates

          Updated version number to v`${{ steps.add-to-changelog.outputs.version-number }}`. Copy this number for the [deploy workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml).

          ${{ steps.render-pack-update.outputs.pr-body }}

          ${{ steps.update-carpet.outputs.pr-body }}

          ${{ steps.conflict-note.outputs.note }}

          EOF_AiVMO7YIg1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        if: steps.update-pack.outputs.has-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        with:
          token: ${{ secrets.CREATE_PR_PAT }}
          add-paths: |
            ${{ matrix.pack-directory.directory }}
            CHANGELOG.md
          commit-message: "Update mods for ${{ matrix.pack-directory.directory }}"
          branch: auto-update/${{ matrix.pack-directory.directory }}
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update mods for version ${{ matrix.pack-directory.directory }}"
          body-path: pr-body.md
