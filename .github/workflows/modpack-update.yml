name: Modpack Auto-update

on:
  workflow_dispatch:
  schedule:
    # 1:13 am Monday UTC
    # = 1:13 pm Monday NZST
    - cron: "13 1 * * 1"

permissions: {}

jobs:
  get-build-matrix:
    name: Get build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-updates: ${{ steps.build-matrix.outputs.has-updates }}
      update-modpack-mods-matrix: ${{ steps.build-matrix.outputs.update-modpack-mods-matrix }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Get build matrix
        id: build-matrix
        uses: ./.github/actions/get-build-matrix

  update-pack:
    runs-on: ubuntu-latest
    needs:
      - get-build-matrix
    if: needs.get-build-matrix.outputs.has-updates == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        pack-directory: ${{ fromJson(needs.get-build-matrix.outputs.update-modpack-mods-matrix) }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Setup Packwiz
        uses: SecretOnline/minecraft-actions/setup-packwiz@864a0633b94cd154060d164282f5afc2d77802a9 # v2.1.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      - name: Get minecraft version
        uses: SebRollen/toml-action@b1b3628f55fc3a28208d4203ada8b737e9687876 # v1.2.0
        id: get-minecraft-version
        with:
          file: ${{ matrix.pack-directory.directory }}/pack.toml
          field: versions.minecraft

      - name: Update pack
        id: update-pack
        uses: "./.github/actions/update-modpack-mods"
        with:
          working-directory: ${{ matrix.pack-directory.directory }}

      - name: Update Carpet mod
        id: update-carpet
        uses: "./.github/actions/update-carpet-mod"
        with:
          working-directory: ${{ matrix.pack-directory.directory }}
          minecraft-version: ${{ steps.get-minecraft-version.outputs.value }}

      - name: Packwiz refresh after Carpet update
        if: steps.update-carpet.outputs.is-update == 'true'
        working-directory: ${{ matrix.pack-directory.directory }}
        run: |
          packwiz refresh

      - name: Download jars for Voxy-Sodium compatibility check
        id: download-compat-jars
        if: steps.update-pack.outputs.is-update == 'true'
        run: |
          PACK_DIR="${{ matrix.pack-directory.directory }}"
          VOXY_TOML="$PACK_DIR/mods/voxy.pw.toml"
          SODIUM_TOML="$PACK_DIR/mods/sodium.pw.toml"

          # Skip if Voxy isn't in this pack or Sodium wasn't modified by the update
          if [ ! -f "$VOXY_TOML" ] || [ ! -f "$SODIUM_TOML" ] || git diff HEAD --quiet -- "$SODIUM_TOML"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p /tmp/compat-jars
          VOXY_URL=$(grep '^url = ' "$VOXY_TOML" | sed 's/url = "\(.*\)"/\1/')
          SODIUM_URL=$(grep '^url = ' "$SODIUM_TOML" | sed 's/url = "\(.*\)"/\1/')

          wget -q -O /tmp/compat-jars/voxy.jar "$VOXY_URL"
          wget -q -O /tmp/compat-jars/sodium.jar "$SODIUM_URL"

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check Voxy-Sodium compatibility
        id: check-sodium-compat
        if: steps.download-compat-jars.outputs.skip == 'false'
        uses: ./.github/actions/check-fabric-compat
        with:
          dependent-jar: /tmp/compat-jars/voxy.jar
          dependency-jar: /tmp/compat-jars/sodium.jar
          dependency-mod-id: sodium

      - name: Revert Sodium if incompatible with Voxy
        id: revert-sodium
        if: steps.download-compat-jars.outputs.skip == 'false' && steps.check-sodium-compat.outputs.compatible == 'false'
        run: |
          PACK_DIR="${{ matrix.pack-directory.directory }}"
          git checkout HEAD -- "$PACK_DIR/mods/sodium.pw.toml"
          cd "$PACK_DIR" && packwiz refresh

          NOTE="> Note: Sodium was held back as the latest version is not compatible with Voxy."
          echo "note=$NOTE" >> "$GITHUB_OUTPUT"

      - name: Update Complementary Reimagined config
        if: steps.update-pack.outputs.is-update == 'true'
        run: |
          PACK_DIR="${{ matrix.pack-directory.directory }}"
          SHADER_TOML="$PACK_DIR/shaderpacks/complementary-reimagined.pw.toml"

          if [ ! -f "$SHADER_TOML" ]; then
            exit 0
          fi

          NEW_FILENAME=$(grep '^filename = ' "$SHADER_TOML" | sed 's/filename = "\(.*\)"/\1/')
          SHADERPACKS_CONFIG_DIR="$PACK_DIR/config/yosbr/shaderpacks"
          IRIS_PROPERTIES="$PACK_DIR/config/yosbr/config/iris.properties"
          NEW_TXT="$SHADERPACKS_CONFIG_DIR/${NEW_FILENAME}.txt"

          OLD_TXT=$(find "$SHADERPACKS_CONFIG_DIR" -maxdepth 1 -name '*.txt' | head -1)

          if [ -n "$OLD_TXT" ] && [ "$OLD_TXT" != "$NEW_TXT" ]; then
            mv "$OLD_TXT" "$NEW_TXT"
            sed -i "s/shaderPack=.*/shaderPack=$NEW_FILENAME/" "$IRIS_PROPERTIES"
            cd "$PACK_DIR" && packwiz refresh
          fi

      - name: Add to changelog
        id: add-to-changelog
        if: steps.update-pack.outputs.is-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        uses: "./.github/actions/update-project-changelog"
        with:
          working-directory: .
          directory: ${{ matrix.pack-directory.directory }}
          changelog-body: ${{ steps.update-pack.outputs.changelog-body }}${{ steps.update-carpet.outputs.changelog-body }}

      - name: Prepare PR body
        if: steps.update-pack.outputs.is-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        env:
          VERSION_NUMBER: ${{ steps.add-to-changelog.outputs.version-number }}
          PR_BODY: ${{ steps.update-pack.outputs.pr-body }}
          CARPET_PR_BODY: ${{ steps.update-carpet.outputs.pr-body }}
          REVERT_SODIUM_NOTE: ${{ steps.revert-sodium.outputs.note }}
        run: |
          touch pr-body.md
          cat << "EOF_AiVMO7YIg1" >> pr-body.md
          This PR contains automated updates from auto-update workflow.

          ## Updates

          Updated version number to v`${VERSION_NUMBER}`. Copy this number for the [deploy workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml).

          ${PR_BODY}

          ${CARPET_PR_BODY}

          ${REVERT_SODIUM_NOTE}

          EOF_AiVMO7YIg1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.update-pack.outputs.is-update == 'true' || steps.update-carpet.outputs.is-update == 'true'
        with:
          token: ${{ secrets.CREATE_PR_PAT }}
          add-paths: |
            ${{ matrix.pack-directory.directory }}
            CHANGELOG.md
          commit-message: "Update mods for ${{ matrix.pack-directory.directory }}"
          branch: auto-update/${{ matrix.pack-directory.directory }}
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update mods for version ${{ matrix.pack-directory.directory }}"
          body-path: pr-body.md
